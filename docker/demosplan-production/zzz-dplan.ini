; Loaded by every SAPI (one conf.d for CLI and FPM), so these are the CLI baseline.
; FPM-only values — memory_limit, max_execution_time, disable_functions — are php_admin_value
; entries in php-fpm_www.conf.

upload_max_filesize = 10G
post_max_size = 11G

; project-local temp dir used by sys_get_temp_dir() (and thus upload_tmp_dir in the pool config);
; kept inside the writable var/ tree instead of the shared /tmp
sys_temp_dir = /srv/www/var/tmp

max_execution_time = 3600
memory_limit = 6G

max_input_vars=3000

; Set timezone to match Docker container timezone setting
date.timezone = Europe/Berlin

; maximum memory that OPcache can use to store compiled PHP files
opcache.memory_consumption=256

; maximum number of files that can be stored in the cache
opcache.max_accelerated_files=100000
opcache.interned_strings_buffer=32
opcache.fast_shutdown=1

; only honoured at master startup, so this one cannot live in the pool config
opcache.preload=/srv/www/config/preload.php
; required for opcache.preload:
opcache.preload_user=www-data
; https://symfony.com/doc/current/performance.html#don-t-check-php-files-timestamps
; Safe in a built container image: source files never change at runtime.
opcache.validate_timestamps=0

; maximum memory allocated to store the results
realpath_cache_size=4096K

; save the results for 10 minutes (600 seconds)
realpath_cache_ttl=600

error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_USER_DEPRECATED & ~E_STRICT

allow_url_fopen = Off

[session]

gc.max_lifetime = 86400

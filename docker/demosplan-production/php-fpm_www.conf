[www]
listen = 9000
; The official php-fpm image ships docker.conf with clear_env = no, which is included before this
; pool. Workers must not inherit the container environment: it holds deployment secrets, and
; HTTPS_PROXY would route libcurl through an SSL-intercepting proxy whose root CA is not in the
; system trust store. Runtime config reaches the app via parameters.yml and .env.local instead.
clear_env = yes
env[ACTIVE_PROJECT] = $ACTIVE_PROJECT
env[APP_ENV] = $APP_ENV
pm = dynamic
pm.max_children = 40
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no

; Liveness/readiness endpoints. Exposed only via the nginx `location = /fpm-status`
; block (restricted to 127.0.0.1) or hit directly over FastCGI with `cgi-fcgi` in an
; exec probe: `cgi-fcgi -bind -connect 127.0.0.1:9000 /fpm-ping`.
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; FPM-only overrides of the shared conf.d baseline in zzz-dplan.ini — one conf.d serves all SAPIs,
; and the CLI must keep disable_functions unset for Symfony Process. php_admin_value is final:
; ini_set() cannot lift these at runtime.
php_admin_value[memory_limit] = 2G
php_admin_value[max_execution_time] = 1800
; use high socket timeout to allow for long-running requests, e.g. for large file uploads
php_admin_value[default_socket_timeout] = 1800
php_admin_value[upload_tmp_dir] = /srv/www/var/tmp
php_admin_value[disable_functions] = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,exec, shell_exec, eval, passthru, proc_open, popen, show_source, phpinfo, readfile, system

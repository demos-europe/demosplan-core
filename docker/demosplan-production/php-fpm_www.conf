[www]
listen = 9000
pm = dynamic
pm.max_children = 40
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500
catch_workers_output = yes

; The official image's docker.conf sets clear_env = no; keep workers from inheriting the container env.
clear_env = yes

; FPM-only overrides of the shared conf.d baseline: the CLI must keep disable_functions unset for
; Symfony Process. php_admin_value is final: ini_set() cannot lift these at runtime.
php_admin_value[memory_limit] = 2G
php_admin_value[max_execution_time] = 1800
php_admin_value[default_socket_timeout] = 1800
php_admin_value[disable_functions] = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,exec, shell_exec, eval, passthru, proc_open, popen, show_source, phpinfo, readfile, system

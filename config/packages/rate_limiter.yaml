framework:
    rate_limiter:
        # limit anonymous submit of statement
        anonymous_statement:
            policy: 'token_bucket'
            limit: '%ratelimit_anonymous_statement_limit%'
            rate: { interval: '%ratelimit_anonymous_statement_rate_interval%', amount: '%ratelimit_anonymous_statement_rate_amount%' }
        # limit registration requests
        user_register:
            policy: 'token_bucket'
            limit: 2
            rate: { interval: '60 minutes', amount: 1 }
        # limit password reset requests
        user_password_reset:
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '15 minutes', amount: 2 }
        # limit attempts to redeem a procedure pairing code. Keyed per client IP, which for the
        # pushing instance is one egress address shared by all its pairings — hence not tighter.
        procedure_pairing_exchange:
            policy: 'fixed_window'
            limit: 20
            interval: '15 minutes'
        # limit pushes per integration token; a push carries a whole batch.
        procedure_integration_push:
            policy: 'fixed_window'
            limit: 30
            interval: '1 minute'
        # limit api requests for captured bearer tokens
        # the bearer token is reset at every page reload
        jwt_token:
            policy: 'fixed_window'
            limit: '%ratelimit_jwt_token_limit%'
            interval: '%ratelimit_jwt_token_interval%'
